version: "3"

tasks:
  default:
    desc: List available tasks
    cmd: task --list
    silent: true

  restore:
    desc: Fetch solution dependencies
    cmds:
      - dotnet restore

  build:
    desc: Compile the whole solution
    cmds:
      - dotnet build Tiver.Fowl.slnx

  test-main:
    desc: Run the main test suite (framework tests + Selenium examples)
    cmds:
      - dotnet test Tests/Tests.csproj

  test-nunit:
    desc: Run the NUnit consumer suite against the packed NuGet package
    cmds:
      - dotnet test Tests.NUnit/Tests.NUnit.csproj

  test-mstest:
    desc: Run the MSTest consumer suite against the packed NuGet package
    cmds:
      - dotnet test Tests.MSTest/Tests.MSTest.csproj

  tests:
    desc: Run the full test suite (main + NUnit + MSTest consumers)
    cmds:
      - task: test-main
      - task: test-nunit
      - task: test-mstest

  test-grid:
    desc: Run the Selenium Grid integration tests against a throwaway container (needs Docker; first run pulls ~1.5GB)
    vars:
      CONTAINER: tiver-fowl-grid
      IMAGE: selenium/standalone-chrome
    preconditions:
      - sh: docker info
        msg: Docker is unavailable — the Grid tests need a container to run against.
    cmds:
      # Clear a container left behind by an interrupted run, so the port is free.
      - cmd: docker rm -f {{.CONTAINER}}
        ignore_error: true
      - docker run -d --name {{.CONTAINER}} --shm-size=2g -p 4444:4444 {{.IMAGE}}
      # Registered before the wait, so the container is removed even if readiness or the tests fail.
      - defer: docker rm -f {{.CONTAINER}}
      - cmd: |
          for _ in $(seq 1 60); do
            if curl -sf --max-time 2 http://localhost:4444/status | grep -q '"ready": *true'; then
              echo "Grid ready."
              exit 0
            fi
            sleep 2
          done
          echo "Grid did not report ready within 120s." >&2
          exit 1
      - dotnet test Tests/Tests.csproj --filter "TestCategory=Grid"

  report-demo:
    desc: Generate a sample HTML report from the explicit demo fixtures (one test fails on purpose)
    cmds:
      - cmd: dotnet test Tests/Tests.csproj --filter "FullyQualifiedName~Tests.Demo"
        ignore_error: true
      - cmd: 'echo "Report: $(ls -t Tests/bin/Debug/net10.0/test-report-*.html | head -1)"'

  pack:
    desc: Create the NuGet package; version set by MinVer from git tags (VERSIONING.md)
    cmds:
      - dotnet pack Tiver.Fowl/Tiver.Fowl.csproj -c Release

  tag:
    desc: 'Tag a version and push it, starting a pre-release or finalizing a release (VERSIONING.md) — usage: task tag VERSION=1.1.0-alpha.0 (pre-release) or task tag VERSION=1.1.0 (release)'
    requires:
      vars: [VERSION]
    preconditions:
      - sh: test -z "$(git status --porcelain)"
        msg: Uncommitted changes present — commit or stash before tagging.
    prompt: Tag {{.VERSION}} and push it to origin?
    cmds:
      - git tag {{.VERSION}}
      - git push --tags
